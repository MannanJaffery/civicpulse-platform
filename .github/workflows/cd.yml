name: CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

jobs:
  test:
    name: Verify Merged Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        env:
          TRIAGE_PROVIDER: simulated
          ENVIRONMENT: test
        run: |
          cd backend
          pytest --cov=app --cov-fail-under=65

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm test -- --run

  build-push:
    name: Build, Push & Emit SBOM
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      backend-digest: ${{ steps.build-backend.outputs.digest }}
      frontend-digest: ${{ steps.build-frontend.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image (by Git SHA and latest)
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
            ${{ env.IMAGE_BACKEND }}:latest

      - name: Build and Push Frontend Image (by Git SHA and latest)
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest

      - name: Install Syft SBOM Generator
        uses: anchore/sbom-action/download-syft@v0.17.9

      - name: Generate Backend SBOM
        run: |
          syft ${{ env.IMAGE_BACKEND }}:${{ github.sha }} -o spdx-json=backend-sbom.spdx.json

      - name: Generate Frontend SBOM
        run: |
          syft ${{ env.IMAGE_FRONTEND }}:${{ github.sha }} -o spdx-json=frontend-sbom.spdx.json

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: "*.spdx.json"

  deploy-k8s:
    name: Ephemeral Kubernetes Deployment & Verification
    runs-on: ubuntu-latest
    needs: [build-push]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create KinD Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: civicpulse-ci-cluster
          wait: 120s

      - name: Install Ingress-NGINX on KinD
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

      - name: Update Kustomize Overlay with Git SHA
        run: |
          cd k8s/overlays/prod
          kustomize edit set image \
            ghcr.io/mannanjaffery/civicpulse-platform/backend=${{ env.IMAGE_BACKEND }}:${{ github.sha }} \
            ghcr.io/mannanjaffery/civicpulse-platform/frontend=${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

      - name: Deploy Production Overlays to Cluster
        run: |
          kubectl apply -k k8s/overlays/prod

      - name: Wait for Rollout Status
        run: |
          kubectl rollout status deployment/backend -n civicpulse --timeout=180s
          kubectl rollout status deployment/frontend -n civicpulse --timeout=180s

      - name: Verify Workloads and Print HPA Status
        run: |
          echo "=== All Pods in Namespace civicpulse ==="
          kubectl get pods -n civicpulse -o wide
          echo "=== Services ==="
          kubectl get svc -n civicpulse
          echo "=== Horizontal Pod Autoscalers ==="
          kubectl get hpa -n civicpulse || true
